<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>identity wallpaper</title>
<!--
  Vendored stand-in for homelab-bootstrap's dotfiles/wallpapers/fx.html.

  Same contract as the shared themes so the two are interchangeable:
      ?label=<big name>&host=<hostname>&tag=<role>&ip=<tailscale ip>
  Rendered at 1920x1080 by headless Chrome from Set-IdentityWallpaper in
  windows/lib/common.ps1.

  Tier 1 (the real shared theme in homelab-bootstrap) wins whenever that repo
  is reachable; this only renders when it is not. Replace this file with the
  real one and nothing else changes.

  Everything is inline and self-contained: no fonts, images or scripts are
  fetched, because this renders on a machine that may have no working VPN or
  tailnet yet and a blocked request would just stall the 8s render budget.
-->
<style>
  :root {
    --bg0: #070b12;
    --bg1: #0f1a2b;
    --bg2: #13243a;
    --accent: #4ea1f7;
    --accent-dim: #2d6ea8;
    --text: #e9eef6;
    --muted: #8295ad;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: var(--bg0);
    font-family: "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  .stage { position: relative; width: 100%; height: 100%; }

  /* Two offset radial pools rather than a flat linear ramp: it keeps the
     lower-left quadrant dark where the desktop icons sit. */
  .wash {
    position: absolute; inset: 0;
    background:
      radial-gradient(120% 90% at 78% 18%, var(--bg2) 0%, transparent 60%),
      radial-gradient(90% 70% at 88% 72%, #16304d 0%, transparent 55%),
      linear-gradient(160deg, var(--bg1) 0%, var(--bg0) 70%);
  }

  /* Concentric arcs centred off-canvas, so only the sweep shows. */
  .arcs { position: absolute; top: 50%; right: -340px; transform: translateY(-50%); opacity: .5; }
  .arcs circle { fill: none; stroke: var(--accent); }

  /* Fine grid, masked so it fades out before it reaches the icon area. */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(78,161,247,.07) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(78,161,247,.07) 1px, transparent 1px);
    background-size: 60px 60px;
    -webkit-mask-image: radial-gradient(85% 75% at 80% 35%, #000 0%, transparent 72%);
            mask-image: radial-gradient(85% 75% at 80% 35%, #000 0%, transparent 72%);
  }

  /* Grain, drawn as an SVG turbulence so no image file is needed. */
  .grain { position: absolute; inset: 0; opacity: .035; mix-blend-mode: overlay; }

  /* ---- the panel ------------------------------------------------------- */
  /* Top right: never under the desktop icons, and clear of the taskbar. */
  .panel { position: absolute; top: 128px; right: 136px; text-align: right; }

  .tag {
    font-size: 15px; letter-spacing: .34em; text-transform: uppercase;
    color: var(--accent); opacity: .85; margin-bottom: 14px;
  }

  .label {
    font-size: 132px; font-weight: 200; line-height: .92;
    letter-spacing: -.035em;
    background: linear-gradient(100deg, #ffffff 10%, var(--accent) 120%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .rule {
    height: 1px; margin: 30px 0 22px auto; width: 300px;
    background: linear-gradient(to left, var(--accent), transparent);
  }

  .rows { display: inline-block; text-align: left; }
  .row { display: flex; gap: 20px; align-items: baseline; margin-bottom: 9px; }
  .row .k {
    width: 92px; text-align: right; flex: none;
    font-size: 13px; letter-spacing: .13em; text-transform: uppercase;
    color: var(--muted);
  }
  .row .v {
    font-family: Consolas, ui-monospace, monospace;
    font-size: 20px; color: var(--text);
  }
  .row .v.dim { color: var(--muted); }

  /* A machine with no tailnet address is a thing to notice, not to hide. */
  .row .v.absent { color: #e0a33a; }
</style>
</head>
<body>
<div class="stage">
  <div class="wash"></div>
  <div class="grid"></div>

  <svg class="arcs" width="1100" height="1100" viewBox="0 0 1100 1100">
    <circle cx="550" cy="550" r="250" stroke-width="1"   opacity=".30"/>
    <circle cx="550" cy="550" r="340" stroke-width="1"   opacity="  .22"/>
    <circle cx="550" cy="550" r="430" stroke-width="1.5" opacity=".16"/>
    <circle cx="550" cy="550" r="520" stroke-width="1"   opacity=".10"/>
    <circle cx="550" cy="550" r="118" stroke-width="2"   opacity=".45" stroke-dasharray="3 13"/>
  </svg>

  <svg class="grain" width="100%" height="100%">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/></filter>
    <rect width="100%" height="100%" filter="url(#n)"/>
  </svg>

  <div class="panel">
    <div class="tag"  id="tag"></div>
    <div class="label" id="label"></div>
    <div class="rule"></div>
    <div class="rows">
      <div class="row"><div class="k">host</div><div class="v" id="host"></div></div>
      <div class="row"><div class="k">tailscale</div><div class="v" id="ip"></div></div>
      <div class="row"><div class="k">updated</div><div class="v dim" id="updated"></div></div>
    </div>
  </div>
</div>

<script>
  var q = new URLSearchParams(location.search);

  function put(id, value, absentText) {
    var el = document.getElementById(id);
    if (value) { el.textContent = value; return; }
    el.textContent = absentText || '';
    el.classList.add('absent');
  }

  var label = q.get('label') || q.get('host') || 'UNNAMED';
  put('label', label);
  put('host', q.get('host') || '');
  put('tag', q.get('tag') || '');
  // Blank is the normal state before Tailscale is signed in, so say so rather
  // than leaving a gap that reads as a rendering fault.
  put('ip', q.get('ip'), 'not signed in');

  var d = new Date();
  function p(n) { return String(n).padStart(2, '0'); }
  document.getElementById('updated').textContent =
    d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
</script>
</body>
</html>
